<!doctype html>
<!--
  PROTOTYPE — throwaway. 目标插件：dsh-newbe-ide（面板叫「IDE」，v1 内容就是运行控制台；名字取大是为了以后装别的功能）。
  Question: 两层 tab（项目 → 命令）具体长什么样？运行配置收进头部按钮。
  结构：一级 tab = 项目，二级 tab = 该项目下的多条启动命令（各自独立启停/日志/环境变量）。
  「总览」tab 是配置项（右上角 chip 可开关），不再是独立变体。
  一个结构分叉用 ?variant=A|B 或底部悬浮条 / ←→ 切换：
    A 二级 tab 独立一行；B 二级 tab 并入控制台头部（与启停按钮同一行）。
  假数据，纯前端，无后端。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dsh-newbe-ide · 原型</title>
<style>
  :root{
    --bg:#0e1014; --panel:#141821; --panel-2:#1a1f29; --rail:#0b0d11;
    --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.16);
    --fg:#e7e9ec; --fg-2:#98a1ad; --fg-3:#6d7683;
    --accent:#4c8dff; --ok:#2ea043; --warn:#d29922; --err:#e5534b; --idle:#5b6470;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#eef0f4; --panel:#fff; --panel-2:#f6f7f9; --rail:#e6e9ee;
      --line:rgba(0,0,0,.10); --line-2:rgba(0,0,0,.18);
      --fg:#1b1f26; --fg-2:#5c646f; --fg-3:#868e99; --idle:#aab2bd;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input,select{font:inherit;color:inherit}
  mark{background:rgba(255,196,0,.28);color:inherit;border-radius:2px}

  .shell{display:grid;grid-template-columns:224px 1fr;height:100vh;overflow:hidden}
  .rail{background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 10px}
  .brand{display:flex;align-items:center;gap:8px;padding:6px 8px 14px;color:var(--fg-2);font-weight:600;font-size:12px}
  .brand i{width:16px;height:16px;border-radius:5px;background:linear-gradient(135deg,#4c8dff,#9a6bff);display:block}
  .railgroup{margin-bottom:14px}
  .railhead{font-size:11px;color:var(--fg-3);padding:0 8px 6px}
  .railrow{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;color:var(--fg-2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .railrow span{overflow:hidden;text-overflow:ellipsis}
  .railfoot{margin-top:auto;display:flex;gap:6px;padding:8px 4px 0;border-top:1px solid var(--line)}
  .railbtn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--fg-2)}
  .railbtn:hover{background:rgba(128,128,128,.14)}
  .railbtn.active{background:rgba(76,141,255,.16);color:var(--accent)}
  .main{overflow:hidden;display:flex;flex-direction:column;min-width:0}

  .sub{color:var(--fg-3);font-size:11px}
  .grow{flex:1}
  .btn{border:1px solid var(--line-2);border-radius:7px;padding:4px 11px;font-size:12px;color:var(--fg-2)}
  .btn:hover{background:rgba(128,128,128,.14);color:var(--fg)}
  .btn.primary{border-color:transparent;background:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.danger{border-color:rgba(229,83,75,.5);color:var(--err)}
  .btn.sm{padding:2px 8px;font-size:11px}
  .field{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:5px 9px;min-width:150px;outline:none}
  .field:focus{border-color:var(--accent)}
  .chip{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:11px;color:var(--fg-2);user-select:none;cursor:pointer;white-space:nowrap}
  .chip:hover{border-color:var(--line-2)}
  .chip.on{background:rgba(76,141,255,.16);border-color:rgba(76,141,255,.4);color:var(--accent)}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--idle)}
  .dot.running{background:var(--ok);box-shadow:0 0 0 3px rgba(46,160,67,.18)}
  .dot.exited{background:var(--warn)}
  .dot.failed{background:var(--err)}
  .dot.sm{width:6px;height:6px;box-shadow:none}
  .port{font:11px var(--mono);color:var(--fg-2);border:1px solid var(--line);border-radius:5px;padding:0 5px}
  .mono{font-family:var(--mono)}
  .log{font:12px/1.55 var(--mono);white-space:pre-wrap;word-break:break-all;overflow:auto}
  .lv-ERROR{color:var(--err)}
  .lv-WARN{color:var(--warn)}
  .lv-INFO{color:var(--fg)}
  .lv-DEBUG,.lv-OTHER{color:var(--fg-2)}
  .stack{color:var(--fg-2);padding-left:22px!important}
  .notice{border:1px dashed var(--line-2);border-radius:8px;padding:8px 11px;font-size:12px;color:var(--fg-2);display:flex;align-items:center;gap:10px}
  .notice b{color:var(--fg);font-weight:600}
  .envs{width:100%;border-collapse:collapse;font:11px var(--mono);margin-top:2px}
  .envs td{padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  .envs td:first-child{color:var(--fg-2);white-space:nowrap}
  .envs td:last-child{word-break:break-all}
  .masked{color:var(--fg-3);cursor:pointer;border-bottom:1px dotted var(--line-2)}

  /* ---- 一级 tab：项目 ---- */
  .tabrow{display:flex;align-items:stretch;border-bottom:1px solid var(--line);flex:none;min-width:0}
  .tabbar{display:flex;align-items:stretch;gap:2px;padding:0 4px 0 14px;overflow-x:auto;overflow-y:hidden;flex:1;min-width:0;scrollbar-width:none;scroll-behavior:smooth}
  .tabbar::-webkit-scrollbar{display:none}
  .tabbar.dragging{cursor:grabbing;scroll-behavior:auto}
  .tab{display:flex;align-items:center;gap:7px;padding:9px 10px 8px;color:var(--fg-2);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;flex:none}
  .tab:hover{color:var(--fg)}
  .tab.sel{color:var(--fg);border-bottom-color:var(--accent)}
  .tab .x{opacity:0;font-size:13px;line-height:1;padding:0 2px;border-radius:4px;color:var(--fg-3)}
  .tab:hover .x{opacity:1}
  .tab .x:hover{background:rgba(128,128,128,.22);color:var(--fg)}
  .tabtools{display:flex;align-items:center;gap:6px;padding:0 12px 0 8px;border-left:1px solid var(--line);flex:none}
  .tabtools select{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:3px 6px;font-size:12px;color:var(--fg-2);max-width:170px}
  .overflow{position:relative}
  .overflow>summary{list-style:none;cursor:pointer;width:28px;height:26px;border:1px solid var(--line);border-radius:7px;display:grid;place-items:center;color:var(--fg-2)}
  .overflow>summary::-webkit-details-marker{display:none}
  .overflow>summary:hover{background:rgba(128,128,128,.14)}
  .overflow ul{position:absolute;right:0;top:32px;z-index:30;background:var(--panel);border:1px solid var(--line-2);border-radius:9px;box-shadow:0 14px 34px rgba(0,0,0,.42);padding:6px;margin:0;list-style:none;min-width:250px;max-height:340px;overflow:auto}
  .overflow li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--fg-2)}
  .overflow li:hover{background:rgba(128,128,128,.16);color:var(--fg)}
  .overflow li.sel{color:var(--accent)}
  .overflow li .sub{margin-left:auto}

  /* ---- 二级 tab：命令 ---- */
  .subrow{display:flex;align-items:center;gap:6px;padding:7px 14px;border-bottom:1px solid var(--line);flex:none;overflow-x:auto;scrollbar-width:none}
  .subrow::-webkit-scrollbar{display:none}
  .subtab{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--fg-2);white-space:nowrap;cursor:pointer;flex:none}
  .subtab:hover{border-color:var(--line-2);color:var(--fg)}
  .subtab.sel{background:rgba(76,141,255,.14);border-color:rgba(76,141,255,.45);color:var(--accent)}
  .subtab .x{opacity:0;font-size:12px;line-height:1;color:var(--fg-3)}
  .subtab:hover .x{opacity:1}
  .head .seg{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px}
  .head .seg .subtab{border:none;padding:2px 9px}

  .panelwrap{display:flex;flex-direction:column;flex:1;min-height:0;padding:12px 18px 84px}
  .head{display:flex;align-items:center;gap:12px;padding:11px 13px;background:var(--panel);border:1px solid var(--line);border-radius:9px;flex:none;flex-wrap:wrap}
  .metric{display:flex;flex-direction:column;gap:1px;padding-right:14px;border-right:1px solid var(--line)}
  .metric b{font:600 13px var(--mono)}
  .metric i{font-style:normal;font-size:10px;color:var(--fg-3)}
  .btn.on{background:rgba(76,141,255,.16);border-color:rgba(76,141,255,.45);color:var(--accent)}
  .cfgopen{margin-top:8px;border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:10px 13px;display:grid;gap:8px}
  .cfgline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .console{margin-top:8px;border:1px solid var(--line);border-radius:9px;background:var(--panel);display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
  .filters{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid var(--line);flex-wrap:wrap;flex:none}
  .console .log{flex:1;min-height:0;padding:8px 11px;background:rgba(0,0,0,.16)}
  @media (prefers-color-scheme: light){ .console .log{background:#f4f6f9} }
  .empty{margin:auto;text-align:center;color:var(--fg-3);display:grid;gap:10px;justify-items:center}

  .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px;padding:14px 18px 84px;overflow:auto;flex:1;min-height:0;align-content:start}
  .card{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:8px}
  .card:hover{border-color:var(--line-2)}
  .cmdrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;background:var(--panel-2)}
  .cmdrow .nm{font-weight:600;font-size:12px;cursor:pointer}
  .cmdrow .last{margin-left:auto;font:11px var(--mono);color:var(--fg-3);max-width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .switcher{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:2px;
    background:#111418;color:#e7e9ec;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 7px;
    box-shadow:0 10px 30px rgba(0,0,0,.45);font:12px var(--sans)}
  .switcher button{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;color:#cfd6de}
  .switcher button:hover{background:rgba(255,255,255,.12)}
  .switcher .label{padding:0 10px;min-width:230px;text-align:center;white-space:nowrap}
  .switcher .k{color:#7f8b99;font-size:11px}
  .caption{position:fixed;left:50%;bottom:62px;transform:translateX(-50%);z-index:59;max-width:min(820px,92vw);text-align:center;
    font-size:11.5px;color:var(--fg-2);background:rgba(20,24,33,.92);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
  @media (prefers-color-scheme: light){ .caption{background:rgba(255,255,255,.94)} }
</style>
</head>
<body>

<div class="shell">
  <aside class="rail">
    <div class="brand"><i></i><span>DeepSeek Harness</span></div>
    <div class="railgroup">
      <div class="railhead">工作区</div>
      <div class="railrow"><span>kun-ai</span></div>
      <div class="railrow"><span>hague-config</span></div>
      <div class="railrow"><span>dsh-newbe-plugins</span></div>
      <div class="railrow"><span>…（共 41 个）</span></div>
    </div>
    <div class="railfoot">
      <div class="railbtn" title="设置">
        <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="2.4"/><path d="M8 1.6v1.6M8 12.8v1.6M1.6 8h1.6M12.8 8h1.6M3.5 3.5l1.1 1.1M11.4 11.4l1.1 1.1M12.5 3.5l-1.1 1.1M4.6 11.4l-1.1 1.1"/></svg>
      </div>
      <div class="railbtn active" title="IDE">
        <svg width="17" height="17" viewBox="0 0 16 16" fill="none"><rect x="1.6" y="2.6" width="12.8" height="10.8" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M6.5 5.9 10.4 8l-3.9 2.1z" fill="currentColor"/></svg>
      </div>
    </div>
  </aside>
  <main class="main" id="stage"></main>
</div>

<div class="caption" id="caption"></div>
<div class="switcher">
  <button id="prev" title="上一个 (←)">‹</button>
  <div class="label"><span id="vlabel"></span> <span class="k">(← → 切换)</span></div>
  <button id="next" title="下一个 (→)">›</button>
</div>

<script>
(function () {
  'use strict';

  /* 一个项目 = 一个 tab；项目下多条命令 = 二级 tab，各自独立启停/日志/环境变量 */

        cmd:'mvn -o -pl kun-file-web -am spring-boot:run', envs:[] }

  ];

  var BOOT = [
    '2026-09-12 10:12:31.204  INFO 41207 --- [           main] c.p.k.a.web.KunAiApplication             : Starting KunAiApplication using Java 21.0.12.1 with PID 41207',

    '2026-09-12 10:12:35.117  WARN 41207 --- [           main] c.p.k.a.core.config.RedisConfiguration   : Redis 连接池使用默认超时 2000ms，建议显式配置',
    '2026-09-12 10:12:35.990 ERROR 41207 --- [           main] c.p.k.a.core.review.RuleLoader           : 规则文件加载失败，已回退到内置默认规则',
    '\tat com.pingpongx.kun.ai.core.review.RuleLoader.load(RuleLoader.java:64)',
    '2026-09-12 10:12:36.904  INFO 41207 --- [           main] o.s.b.w.embedded.tomcat.TomcatWebServer  : Tomcat started on port 8083 (http) with context path \'\'',
    '2026-09-12 10:12:36.911  INFO 41207 --- [           main] c.p.k.a.web.KunAiApplication             : Started KunAiApplication in 6.482 seconds (process running for 7.103)'
  ];
  var STREAM = [
    '2026-09-12 10:14:02.318  INFO 41207 --- [nio-8083-exec-2] c.p.k.a.web.ReviewController             : 收到审核请求 taskId=88213 类型=INBOUND',
    '2026-09-12 10:14:04.775  INFO 41207 --- [nio-8083-exec-5] c.p.k.a.core.harness.LlmClient           : LLM 响应耗时 8421ms，超过阈值 5000ms',
    '2026-09-12 10:14:06.010 ERROR 41207 --- [nio-8083-exec-7] c.p.k.a.web.ReviewController             : 审核任务创建失败',

    '2026-09-12 10:14:09.442  INFO 41207 --- [nio-8083-exec-4] c.p.k.a.core.review.TaskRunner           : 批量任务完成 12/12 耗时 3.1s'
  ];
  var SHORT = [
    '2026-09-12 10:14:01.100  INFO  -- --- [           main] Application                              : 启动命令已执行，等待输出…',

  var L = {};
  function key(pid, cid) { return pid + '/' + cid; }
  PROJECTS.forEach(function (p, i) {
    p.cmds.forEach(function (c) { L[key(p.id, c.id)] = (i === 0 && c.id === 'web') ? BOOT.slice() : []; });
  });

  var PLACEMENTS = {
    A: { name:'二级 tab 独立一行', cap:'A · 项目 tab 下面另起一行放命令 tab（药丸样式）。层级关系一眼看清，代价是纵向多占一行。运行配置收进头部按钮（⚙），不再单独占一行。' },
    B: { name:'二级 tab 并入头部', cap:'B · 命令 tab 做成控制台头部里的分段控件，与启停按钮同一行。省一行高度，代价是项目名、命令名、指标、按钮挤在一行。' }
  };
  var OVERVIEW = '__overview__';
  var params = new URLSearchParams(location.search);
  var S = {
    variant: PLACEMENTS[params.get('variant')] ? params.get('variant') : 'A',
    tabs: ['kun-ai', 'hague-config', 'kun-file', 'kun-monitor', 'short-link'],
    active: 'kun-ai',
    activeCmd: { 'kun-ai': 'web', 'hague-config': 'web', 'kun-file': 'web' },

    envOpen: null,
    drafts: {},
    savedFlash: null,
    importDismissed: false,
    filter: { q:'', regex:false, onlyMatch:false, levels:{ ERROR:true, WARN:true, INFO:true, DEBUG:false, OTHER:true } }
  };

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
  function proj(id) { for (var i = 0; i < PROJECTS.length; i++) if (PROJECTS[i].id === id) return PROJECTS[i]; return null; }
  function cmdOf(p, cid) { if (!p) return null; for (var i = 0; i < p.cmds.length; i++) if (p.cmds[i].id === cid) return p.cmds[i]; return null; }
  function curCmd(p) {
    if (!p) return null;
    if (!S.activeCmd[p.id] && p.cmds.length) S.activeCmd[p.id] = p.cmds[0].id;
    var c = cmdOf(p, S.activeCmd[p.id]);
    if (!c && p.cmds.length) { c = p.cmds[0]; S.activeCmd[p.id] = c.id; }
    return c;
  }
  function projStatus(p) {
    var anyRun = false, anyStarted = false;
    p.cmds.forEach(function (c) { if (c.running) anyRun = true; if (c.startedAt) anyStarted = true; });

  function dotCls(st) { return st === 'running' ? 'running' : (st === 'exited' ? 'exited' : (st === 'failed' ? 'failed' : '')); }
  function levelOf(line) {
    var m = /(TRACE|DEBUG|INFO|WARN|ERROR|FATAL)/.exec(line);

  function uptime(c) {

  function statusText(c) { return !c ? '—' : (c.running ? '运行中' : (c.startedAt ? '已停止' : '未启动')); }
  function lastLine(pid, cid) {
    var src = L[key(pid, cid)] || [];
    for (var i = src.length - 1; i >= 0; i--) if (src[i].trim() !== '') return src[i];
    return '（无输出）';
  }
  function matcher() {
    var f = S.filter;
    if (f.q === '') return null;
    if (f.regex) { try { return new RegExp(f.q, 'i'); } catch (e) {} }
    var low = f.q.toLowerCase();
    return { test: function (s) { return s.toLowerCase().indexOf(low) >= 0; } };
  }
  function hl(text) {
    var safe = esc(text);
    if (!matcher()) return safe;
    var re = S.filter.regex
      ? new RegExp('(' + S.filter.q + ')', 'gi')
      : new RegExp('(' + S.filter.q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return safe.replace(re, '<mark>$1</mark>');
  }
  function visibleLines(k) {
    var m = matcher(), out = [], src = L[k] || [];
    for (var i = 0; i < src.length; i++) {
      var line = src[i];
      if (S.filter.levels[levelOf(line)] !== true) continue;
      if (S.filter.onlyMatch && m && !m.test(line)) continue;

    return out.length > 2000 ? out.slice(out.length - 2000) : out;
  }
  function controls(p, c) {
    var a = 'data-p="' + p.id + '" data-c="' + c.id + '"';
    if (c.running) {
      return '<button class="btn" data-act="restart" ' + a + '>重启</button>' +
             '<button class="btn danger" data-act="stop" ' + a + '>停止</button>';
    }
    return '<button class="btn primary" data-act="start" ' + a + '>启动</button>';
  }
  function filterBar() {
    var f = S.filter;
    function chip(lv) { return '<span class="chip' + (f.levels[lv] ? ' on' : '') + '" data-act="lv" data-lv="' + lv + '">' + lv + '</span>'; }
    return '<div class="filters">' +
      '<input class="field" data-focus="q" data-act="q" placeholder="过滤关键字" value="' + esc(f.q) + '">' +
      '<span class="chip' + (f.regex ? ' on' : '') + '" data-act="regex">正则</span>' +
      '<span class="chip' + (f.onlyMatch ? ' on' : '') + '" data-act="onlyMatch">仅看匹配</span>' +
      '<span class="grow"></span>' + chip('ERROR') + chip('WARN') + chip('INFO') + chip('DEBUG') + chip('OTHER') + '</div>';
  }
  function logHTML(k) {
    var lines = visibleLines(k), html = '', i;

    } else {
      for (i = 0; i < lines.length; i++) {

    return '<div class="log" data-log="' + k + '">' + html +
      '<div class="sub" style="margin-top:6px">已缓存 ' + (L[k] || []).length + ' 行 / 显示 ' + lines.length + ' 行</div></div>';
  }
  function envTable(c) {
    if (!c.envs.length) return '<div class="sub">这条命令没有环境变量</div>';
    var rows = '';
    c.envs.forEach(function (kv) {
      var masked = /KEY|SECRET|TOKEN|PASSWORD/i.test(kv[0]);
      rows += '<tr><td>' + esc(kv[0]) + '</td><td>' + (masked
        ? '<span class="masked" data-act="reveal" data-v="' + esc(kv[1]) + '">' + esc(kv[1]) + ' · 点击显示</span>'
        : esc(kv[1])) + '</td></tr>';
    });
    return '<table class="envs">' + rows + '</table>';
  }
  function importNotice() {
    if (S.importDismissed) return '';
    return '<div class="notice" style="margin:10px 18px 0"><span>发现 <b>2</b> 条 IDEA Spring Boot 运行配置（KunAiApplication、KunAiApplication-workflow）</span>' +
      '<span class="grow"></span><button class="btn" data-act="import">导入为启动配置</button>' +
      '<button class="btn" data-act="dismissImport">忽略</button></div>';
  }

  function visibleTabs() {
    return S.tabs.filter(function (id) {

  }

  /* ---- 一级 tab ---- */
  function tabbar() {
    var vis = visibleTabs(), running = 0;
    var html = '<div class="tabrow"><div class="tabbar" data-act="tabbar">';
    if (S.showOverview) {
      html += '<div class="tab' + (S.active === OVERVIEW ? ' sel' : '') + '" data-act="tab" data-p="' + OVERVIEW + '">' +
        '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="1.5" width="5.2" height="5.2" rx="1"/><rect x="9.3" y="1.5" width="5.2" height="5.2" rx="1"/><rect x="1.5" y="9.3" width="5.2" height="5.2" rx="1"/><rect x="9.3" y="9.3" width="5.2" height="5.2" rx="1"/></svg><span>总览</span></div>';
    }
    vis.forEach(function (id) {
      var p = proj(id), st = projStatus(p);
      if (st === 'running') running++;
      html += '<div class="tab' + (S.active === id ? ' sel' : '') + '" data-act="tab" data-p="' + id + '">' +
        '<span class="dot ' + dotCls(st) + '"></span><span>' + esc(p.title) + '</span>' +
        (p.cmds.length > 1 ? '<span class="sub">' + p.cmds.length + '</span>' : '') +
        '<span class="x" data-act="closeTab" data-p="' + id + '" title="关闭项目 tab">×</span></div>';
    });

    html += '</div>';

    var free = PROJECTS.filter(function (p) { return S.tabs.indexOf(p.id) < 0; });
    html += '<div class="tabtools">';
    html += '<span class="chip' + (S.onlyRunning ? ' on' : '') + '" data-act="onlyRunning" title="隐藏没有运行的项目的 tab">只看运行中</span>';
    html += '<span class="chip' + (S.showOverview ? ' on' : '') + '" data-act="toggleOverview" title="总览 tab 开关（配置项）">总览 tab</span>';
    html += '<details class="overflow"><summary title="全部项目 tab">»</summary><ul>' +
      (S.showOverview ? '<li data-act="tab" data-p="' + OVERVIEW + '" class="' + (S.active === OVERVIEW ? 'sel' : '') + '"><span>总览</span></li>' : '') +
      S.tabs.map(function (id) {
        var p = proj(id), st = projStatus(p);
        return '<li class="' + (S.active === id ? 'sel' : '') + '" data-act="tab" data-p="' + id + '">' +
          '<span class="dot sm ' + dotCls(st) + '"></span><span>' + esc(p.title) + '</span>' +
          '<span class="sub">' + p.cmds.length + ' 个启动配置 · ' + (st === 'running' ? '运行中' : st === 'exited' ? '已停止' : '未启动') + '</span></li>';
      }).join('') + '</ul></details>';

  }

  /* ---- 二级 tab：项目下的命令 ---- */
  function subTabs(p, inHead) {
    var cur = curCmd(p);
    var html = '<div class="' + (inHead ? 'seg' : 'subrow') + '">';
    p.cmds.forEach(function (c) {
      html += '<div class="subtab' + (cur && cur.id === c.id ? ' sel' : '') + '" data-act="cmd" data-p="' + p.id + '" data-c="' + c.id + '">' +
        '<span class="dot sm ' + dotCls(c.running ? 'running' : (c.startedAt ? 'exited' : 'idle')) + '"></span>' +
        '<span>' + esc(c.name) + (c.port ? ' :' + c.port : '') + '</span>' +
        (inHead ? '' : '<span class="x" data-act="closeCmd" data-p="' + p.id + '" data-c="' + c.id + '" title="删除这条启动配置">×</span>') +
      '</div>';
    });

  }

  /* 启动配置面板：名称 / 启动命令 / 工作目录 / 环境变量 + 持久化状态 */
  function cfgPanel(p, c, k) {

    }

      '<div class="cfgline">' +
        '<span class="sub" style="width:56px">名称</span>' +
        '<input class="field" data-focus="' + k + ':name" data-dk="' + k + ':name" value="' + esc(draft('name', c.name)) + '" style="max-width:240px">' +
        '<button class="btn" data-act="saveCfg" data-p="' + p.id + '" data-c="' + c.id + '">保存</button>' +
        '<span class="sub">' + (S.savedFlash === k ? '已保存 ✓' : '') + '</span>' +
      '</div>' +
      '<div class="cfgline">' +
        '<span class="sub" style="width:56px">启动命令</span>' +
        '<input class="field mono" data-focus="' + k + ':cmd" data-dk="' + k + ':cmd" value="' + esc(draft('cmd', c.cmd)) + '" placeholder="例如：mvn -o -pl kun-ai-web -am spring-boot:run" style="flex:1;min-width:280px">' +
      '</div>' +
      '<div class="cfgline"><span class="sub" style="width:56px">工作目录</span><span class="mono">' + esc(p.path) + '</span></div>' +
      '<div class="cfgline" style="align-items:flex-start"><span class="sub" style="width:56px">环境变量</span><div style="flex:1">' + envTable(c) + '</div></div>' +
      '<div class="sub">持久化到 ~/.dsh/storages/dsh-newbe-ide.json（权限 0600，不在项目目录里、不会被 git 提交）</div>' +
    '</div>';
  }

  function consoleBody(p) {
    var c = curCmd(p);
    if (!c) return '<div class="empty">这个项目还没有启动配置<div class="sub">点「＋ 启动配置」加一条</div></div>';
    var k = key(p.id, c.id);
    var head = '<div class="head">' +
        '<span class="dot ' + dotCls(c.running ? 'running' : (c.startedAt ? 'exited' : 'idle')) + '"></span>' +
        '<b style="font-size:14px">' + esc(p.title) + '</b>' +
        (S.variant === 'B' ? subTabs(p, true) : '<span class="sub">/ ' + esc(c.name) + '</span>') +
        '<span class="grow"></span>' +
        '<div class="metric"><b>' + (c.port ? ':' + c.port : '—') + '</b><i>端口</i></div>' +
        '<div class="metric"><b>' + (c.pid || '—') + '</b><i>PID</i></div>' +
        '<div class="metric"><b>' + uptime(c) + '</b><i>运行时长</i></div>' +
        '<button class="btn' + (S.envOpen === k ? ' on' : '') + '" data-act="toggleEnv" data-k="' + k + '" title="启动配置：名称、启动命令、工作目录、环境变量">⚙ 启动配置</button>' +

    '</div>';
  }

  function emptyState() {
    return '<div class="empty"><div>还没有添加任何项目</div>' +

  }

  function board() {
    var html = '<div class="board">';
    S.tabs.forEach(function (id) {
      var p = proj(id);

      html += '<div class="card"><div style="display:flex;align-items:center;gap:8px">' +
        '<span class="dot ' + dotCls(projStatus(p)) + '"></span><b>' + esc(p.title) + '</b>' +
        '<span class="grow"></span><span class="sub">' + esc(p.path) + '</span></div>';

          '<span class="dot sm ' + dotCls(c.running ? 'running' : (c.startedAt ? 'exited' : 'idle')) + '"></span>' +
          '<span class="nm" data-act="cmd" data-p="' + p.id + '" data-c="' + c.id + '">' + esc(c.name) + (c.port ? ' :' + c.port : '') + '</span>' +

  function stageHTML() {

    var p = proj(S.active === OVERVIEW ? S.tabs[0] : S.active);

  }

  function render() {
    var a = document.activeElement;
    var focusKey = a && a.getAttribute ? a.getAttribute('data-focus') : null;
    var selStart = a && a.selectionStart != null ? a.selectionStart : null;

    document.getElementById('stage').innerHTML = stageHTML();
    document.getElementById('vlabel').textContent = S.variant + ' (' + PLACEMENTS[S.variant].name + ')';
    document.getElementById('caption').textContent = PLACEMENTS[S.variant].cap;

    if (focusKey) {
      var el = document.querySelector('[data-focus="' + focusKey + '"]');
      if (el) { el.focus(); if (selStart != null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selStart); } catch (e) {} } }
    }

    var sel = document.querySelector('.tab.sel');
    if (sel && sel.scrollIntoView) { try { sel.scrollIntoView({ inline: 'nearest', block: 'nearest' }); } catch (e) {} }
  }
  function scrollLogs() {
    var logs = document.querySelectorAll('[data-log]');
    for (var i = 0; i < logs.length; i++) {
      var el = logs[i];
      if (el.scrollHeight - el.scrollTop - el.clientHeight < 90) el.scrollTop = el.scrollHeight;
    }
  }
  function refreshLogs() {
    var logs = document.querySelectorAll('[data-log]');
    for (var i = 0; i < logs.length; i++) {
      var k = logs[i].getAttribute('data-log');
      var pin = logs[i].scrollHeight - logs[i].scrollTop - logs[i].clientHeight < 90;

    }

  function push(k, lines) { (L[k] = L[k] || []).push.apply(L[k], lines); }
  function start(p, c) {

  function stop(p, c) {
    c.running = false; c.pid = null;

    render();
  }

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-act]');

    if (act === 'tabbar') return;
    if (act === 'tab') {
      S.active = pid;
      if (pid !== OVERVIEW) { if (!S.activeCmd[pid]) curCmd(p); if (S.onlyRunning && projStatus(p) !== 'running') S.onlyRunning = false; }

    else if (act === 'cmd') { if (p) { S.activeCmd[p.id] = cid; if (S.active === OVERVIEW) S.active = p.id; } render(); }
    else if (act === 'closeCmd') { ev.stopPropagation(); if (p) { p.cmds = p.cmds.filter(function (x) { return x.id !== cid; }); } render(); }
    else if (act === 'addCmd') {
      if (p) { var n = '启动配置 ' + (p.cmds.length + 1); p.cmds.push({ id: 'c' + Date.now(), name: n, port: null, running: false, pid: null, startedAt: null, cmd: '', envs: [] }); S.activeCmd[p.id] = p.cmds[p.cmds.length - 1].id; }

    else if (act === 'toggleOverview') { S.showOverview = !S.showOverview; if (S.showOverview && S.active === OVERVIEW) S.active = S.tabs[0] || OVERVIEW; render(); }
    else if (act === 'onlyRunning') {
      S.onlyRunning = !S.onlyRunning;

      render();
    }
    else if (act === 'start') { start(p, c); }
    else if (act === 'stop') { stop(p, c); }
    else if (act === 'restart') { stop(p, c); setTimeout(function () { start(p, c); }, 400); }
    else if (act === 'toggleEnv') { var k = t.getAttribute('data-k'); S.envOpen = S.envOpen === k ? null : k; render(); }
    else if (act === 'saveCfg') {
      var kk = key(pid, cid);
      if (S.drafts[kk + ':name'] !== undefined && S.drafts[kk + ':name'].trim() !== '') c.name = S.drafts[kk + ':name'].trim();
      if (S.drafts[kk + ':cmd'] !== undefined) c.cmd = S.drafts[kk + ':cmd'];
      delete S.drafts[kk + ':name']; delete S.drafts[kk + ':cmd'];
      S.savedFlash = kk;
      push(kk, ['2026-09-12 10:16:00.000  INFO  -- --- [           main] RunConsole                               : 启动配置「' + c.name + '」已保存到 storages/dsh-newbe-ide.json']);
      render();
    }
    else if (act === 'regex') { S.filter.regex = !S.filter.regex; render(); }
    else if (act === 'onlyMatch') { S.filter.onlyMatch = !S.filter.onlyMatch; render(); }
    else if (act === 'lv') { var lv = t.getAttribute('data-lv'); S.filter.levels[lv] = !S.filter.levels[lv]; render(); }
    else if (act === 'import') { S.importDismissed = true; push(key('kun-ai','web'), ['2026-09-12 10:15:10.000  INFO  -- --- [           main] RunConsole                               : 已从 .idea/workspace.xml 导入 2 条启动配置（含环境变量）']); render(); }
    else if (act === 'dismissImport') { S.importDismissed = true; render(); }
    else if (act === 'reveal') { t.textContent = t.getAttribute('data-v'); t.classList.remove('masked'); }
  });

  document.addEventListener('change', function (ev) {
    var el = ev.target;
    if (el.getAttribute && el.getAttribute('data-act') === 'addTab' && el.value) {
      if (S.tabs.indexOf(el.value) < 0) S.tabs.push(el.value);
      S.active = el.value;
      var p = proj(el.value); if (p) curCmd(p);
      render();
    }
  });

  document.addEventListener('input', function (ev) {
    var el = ev.target, act = el.getAttribute && el.getAttribute('data-act');
    if (act === 'q') { S.filter.q = el.value; refreshLogs(); }
    var dk = el.getAttribute && el.getAttribute('data-dk');
    if (dk) S.drafts[dk] = el.value;
  });

  document.addEventListener('wheel', function (ev) {
    var bar = ev.target.closest ? ev.target.closest('.tabbar') : null;
    if (!bar) return;
    if (Math.abs(ev.deltaY) <= Math.abs(ev.deltaX)) return;
    bar.scrollLeft += ev.deltaY;
    ev.preventDefault();
  }, { passive: false });

  var drag = null;
  document.addEventListener('mousedown', function (ev) {
    var bar = ev.target.closest ? ev.target.closest('.tabbar') : null;
    if (!bar) return;
    drag = { bar: bar, x: ev.clientX, left: bar.scrollLeft };
    bar.classList.add('dragging');
  });
  document.addEventListener('mousemove', function (ev) { if (drag) drag.bar.scrollLeft = drag.left - (ev.clientX - drag.x); });
  document.addEventListener('mouseup', function () { if (drag) { drag.bar.classList.remove('dragging'); drag = null; } });

  setInterval(function () {
    var changed = false;
    PROJECTS.forEach(function (p) {
      p.cmds.forEach(function (c) {
        if (!c.running) return;
        if (Math.random() < 0.5) {
          var n = 15 + Math.floor(Math.random() * 9);
          push(key(p.id, c.id), [STREAM[Math.floor(Math.random() * STREAM.length)].replace('10:14', '10:' + String(n).padStart(2, '0'))]);
          changed = true;
        }
      });
    });
    if (!changed) return;
    refreshLogs();
    render();
  }, 1500);

  function setVariant(v) { S.variant = v; history.replaceState(null, '', '?variant=' + v); render(); }
  function cycle(d) { var keys = ['A', 'B'], i = keys.indexOf(S.variant); setVariant(keys[(i + d + keys.length) % keys.length]); }
  document.getElementById('prev').onclick = function () { cycle(-1); };
  document.getElementById('next').onclick = function () { cycle(1); };
  document.addEventListener('keydown', function (ev) {
    var a = document.activeElement;
    if (a && (a.tagName === 'INPUT' || a.tagName === 'SELECT' || a.tagName === 'TEXTAREA' || a.isContentEditable)) return;
    if (ev.key === 'ArrowLeft') cycle(-1);
    if (ev.key === 'ArrowRight') cycle(1);
  });

  render();
})();
</script>
</body>
</html>
